name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The five stages (PROGRAM.md D6, SPEC §7). Order is the argument:
      # typecheck -> lint -> unit -> e2e:smoke -> eval
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: unit
        run: pnpm test -- --project unit
      - name: install playwright browsers
        run: pnpm --filter @snapgauge/web exec playwright install --with-deps chromium
      - name: e2e-smoke
        # Real from M5 (apps/web): Playwright drives a production build of
        # the demo site (playwright.config.ts's webServer runs `next build
        # && next start`).
        run: pnpm e2e:smoke
      - name: eval
        run: pnpm test -- --project eval

      # Publish-shape guards: dist compiles, tarball exports resolve to dist/.
      - name: build
        run: pnpm build
      - name: pack-check
        run: pnpm ci:pack-check
      - name: brand drift
        # scripts/brand.mjs is deterministic (SPEC's brand acceptance
        # criterion, BRAND-KIT.md) — regenerate and fail if committed
        # apps/web/public/brand/* differs from the generator's output.
        run: pnpm ci:brand-check
